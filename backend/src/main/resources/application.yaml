spring:
  task:
    scheduling:
      pool:
        size: 5
  mail:
    host: ${CAMPUS_SMTP_HOST:localhost}
    port: ${CAMPUS_SMTP_PORT:1025}
    username: ${CAMPUS_SMTP_USERNAME:}
    password: ${CAMPUS_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${CAMPUS_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${CAMPUS_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${CAMPUS_SMTP_STARTTLS:false}
      "[mail.smtp.ssl.enable]": ${CAMPUS_SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/campus
    username: campus
    password: campus-local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
campus:
  demo: false
  public-url: ${CAMPUS_PUBLIC_URL:http://localhost:8080}
  mail:
    from: ${CAMPUS_MAIL_FROM:campus@bgtu.test}
  telegram:
    bot-token: ${CAMPUS_TELEGRAM_BOT_TOKEN:}
    bot-username: ${CAMPUS_TELEGRAM_BOT_USERNAME:}
    api-base-url: ${CAMPUS_TELEGRAM_API_BASE_URL:https://api.telegram.org}
  llm:
    provider: ${CAMPUS_LLM_PROVIDER:auto}
    url: ${CAMPUS_LLM_URL:}
    base-url: ${CAMPUS_LLM_BASE_URL:}
    model: ${CAMPUS_LLM_MODEL:}
    api-key: ${CAMPUS_LLM_API_KEY:}
    reasoning-effort: ${CAMPUS_LLM_REASONING_EFFORT:}
    json-mode: ${CAMPUS_LLM_JSON_MODE:true}
    token-field: ${CAMPUS_LLM_TOKEN_FIELD:}
  penalty:
    amount: 20
    interval: 60s
  semester:
    amount: ${CAMPUS_SEMESTER_AMOUNT:200}
    start-days: "${CAMPUS_SEMESTER_START_DAYS:02-01,09-01}"
  activities:
    monthly-limit: ${CAMPUS_ACTIVITY_MONTHLY_LIMIT:1000}
